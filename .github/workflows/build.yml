name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Dummy Configuration (.env, google-services, debug.keystore)
        run: |
          echo "Setting up dummy configuration files for CI..."
          # Setup .env
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo "DUMMY_KEY=dummy_ci_token" >> .env
            echo "GEMINI_API_KEY=dummy_gemini_api_key_ci" >> .env
          fi

          # Setup debug.keystore
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -D debug.keystore.base64 > debug.keystore 2>/dev/null || true
            fi
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

          # Setup google-services.json
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "dummy-project-ci",
              "storage_bucket": "dummy-project-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "com.aistudio.backgroundrecorder.kxmbvr"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key_ci"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon -Djava.awt.headless=true --stacktrace
          else
            gradle assembleDebug --no-daemon -Djava.awt.headless=true --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
